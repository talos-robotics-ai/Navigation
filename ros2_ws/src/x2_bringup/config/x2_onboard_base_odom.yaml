kilvo_base_odom:
  ros__parameters:
    kilvo_odom_topic: /x2/throttled/kilvo_odom          # x2_throttle (C++), 50 Hz of KILVO's ~930 Hz
    joint_topic_fmt: /x2/throttled/joint/{grp}           # x2_throttle, 25 Hz of the HAL's ~1 kHz
    odom_topic: /x2/odom
    crate_topic: /fpose/crate_pose   # '' = off. In rgbd_head_front -> /x2/crate_pose in odom (for the pnp FSM)
    crate_out_topic: /x2/crate_pose
    publish_tf: false                # the vendor graph has its own /tf
