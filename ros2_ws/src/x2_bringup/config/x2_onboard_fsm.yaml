# pnp_fsm on the robot with the vendor walker: walk to the pre-grasp, align, settle, DONE (standing).
# mc owns the arms: no REACH / GRASP. Applied after x2_box_pnp/config/pnp_params.yaml.
pnp_fsm:
  ros__parameters:
    manipulation: false
    auto_start: false                # start by hand: run_nav_on_pc2.sh go
    # file triggers (run_nav_on_pc2.sh go|reset|estop|clear): no ros2 CLI process on the vendor graph
    trigger_dir: "~/talos_nav_ws/run"
