# pnp_fsm on the robot with the vendor walker: walk to the pre-grasp, align, settle, DONE (standing).
# mc owns the arms: no REACH / GRASP. Applied after x2_box_pnp/config/pnp_params.yaml.
pnp_fsm:
  ros__parameters:
    manipulation: false
    auto_start: false                # start by hand: ros2 service call /pnp/start std_srvs/srv/Trigger
