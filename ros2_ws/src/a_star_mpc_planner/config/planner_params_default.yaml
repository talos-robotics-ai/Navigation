# G1 humanoid tuning for the A* + MPC local planner — Navigation / DLIO stack.
#
# Re-adapted from the G1_navigation planner config for this repo's perception
# front-end: DLIO localization + g1_local_map. The key differences from the
# original config, all driven by the new I/O, are called out inline:
#   * pose      : DLIO odometry on /dlio/odom_node/odom (Odometry → PoseStamped)
#   * obstacles : g1_local_map's ground-removed /local_voxel_map/obstacles
#   * frame     : odom origin is at the SENSOR (~1 m above the floor), so the
#                 floor sits near z ≈ -1 m. Absolute-z rules (step-over, voxel
#                 z-band) are adjusted accordingly; the gmap cost layer is
#                 per-cell relative and so is unaffected by the z offset.
/**:
  ros__parameters:
    # ─── Topics (DLIO + g1_local_map) ───────────────────────────────
    odom_topic: /dlio/odom_node/odom            # DLIO odometry (Odometry msg)
    obstacle_topic: /local_voxel_map/obstacles  # ground-removed obstacle cloud

    # ─── Goal handling ────────────────────────────────────────────
    wait_for_goal: true
    goal_x: 2.0
    goal_y: 0.0
    goal_z: 0.0


    # ─── GLOBAL planner: route over a PRE-BUILT static map ───────────
    # OFF by default — the online-built GlobalCostmap is the default and what you
    # are using now. When true, the global planner routes over a pre-built
    # OccupancyGrid in the MAP frame instead: needs a map server (static_map_topic)
    # AND a map-frame localizer (nav2_amcl -> map_pose_topic + map->odom TF). Live
    # obstacles are left to the local planner (not fused into the static grid).
    # Bring-up: launch/static_map_localization.launch.py.
    use_static_map: false
    static_map_topic: /map
    map_pose_topic: /amcl_pose
    static_occupied_thresh: 50

    # ─── DLIO global 3D map fusion ──────────────────────────────────
    # OFF by default: g1_local_map already gives a dense, ground-removed,
    # robot-centred obstacle cloud, so no static global-map fusion is needed.
    # Set enable_dlio_map:=true to also fuse DLIO's keyframe global map
    # (/dlio/map_node/map) as static context for structure out of the live FOV.
    # That map is NOT ground-removed, so the fusion path strips its floor with
    # per-cell segmentation (ground_segment_height) and caps points above the
    # sensor by dlio_map_z_above before adding them as obstacles.
    # OFF: enabling it (to give A* long-horizon memory of the scene) was tried,
    # but naively fusing DLIO's global accumulated cloud into the LOCAL costmap
    # injected phantom obstacles — the map is not perfectly ground-removed and
    # carries odom drift, so smeared/residual points appeared as ghost blockers
    # and A* detoured around free space (worse the longer it ran). Long-horizon
    # memory needs a dedicated global planner on a clean global costmap, not this
    # raw fusion. See docs/A_STAR_MPC_PLANNER.md.
    enable_dlio_map: false
    dlio_map_topic: /dlio/map_node/map
    dlio_map_max_age_sec: 30.0     # keyframe-rate map → tolerate a longer gap
    dlio_map_z_above: 1.0          # drop fused points > this above the sensor z

    # ─── A* local map / planning ──────────────────────────────────
    # Grid SHRUNK for real-time (issue #3): the old 20 m half-width @ 0.05 m =
    # 800x800 cells made A* (pure-Python) and the per-cycle costmap/voxel
    # allocation the dominant cost. A local planner only needs a few metres of
    # horizon; 6 m @ 0.10 m = 120x120 cells (~44x fewer) replans far faster, and
    # the rolling-horizon goal projection still drives toward goals beyond it.
    grid_reso: 0.10
    grid_half_width: 6.0            # 12 m x 12 m local workspace
    grid_std: 0.2                  # legacy (unused by the inflation costmap)
    # Robot-radius inflation (issue #2). The OLD Gaussian-CDF cost peaked at 0.5
    # exactly on an obstacle, so with obstacle_threshold 0.5 the planner kept
    # ZERO clearance and clipped corners. Now: lethal core = robot_radius (hard
    # block → guaranteed clearance), then a soft penalty band out to
    # inflation_radius that keeps paths off walls.
    robot_radius: 0.35             # G1 base half-width + small margin (LETHAL core)
    # Soft-penalty band OUT TO inflation_radius. Narrowed 0.70 → 0.50: the 0.70 m
    # band (0.35 m beyond the lethal core) was too wide — combined with the high
    # cost weight it made A* treat a broad halo around every obstacle as near-
    # lethal, so it detoured around free space and could not thread normal gaps
    # (doorways). 0.50 keeps paths off walls with only a ~0.15 m soft margin.
    inflation_radius: 0.25
    publish_voxel_grid: false      # 3D voxel layer OFF (big per-cycle alloc)
    obstacle_threshold: 0.5
    # Lowered 500 → 100: at 500 the soft band above acted like a wall (A* paid a
    # huge cost to enter it), which is the other half of "inflation too wide".
    # 100 makes the band a firm nudge off obstacles, not a no-go zone.
    obstacle_cost_weight: 100.0
    replan_rate_hz: 3.0            # faster replans → reactive to moving obstacles
    goal_reached_radius: 0.25
    goal_heading_tolerance: 0.25    # MPC final heading tolerance (~14 deg)
    duplicate_goal_xy_tolerance: 0.05
    duplicate_goal_yaw_tolerance: 0.10
    duplicate_goal_z_tolerance: 0.05
    planning_height: 0.0

    # ─── Ground / obstacle segmentation ────────────────────────────
    ground_segment_en: false
    ground_segment_height: 0.3
    ground_removal_en: false       # legacy cloud-level RANSAC ground strip — off

    # ─── 2.5D height-map awareness ────────────────────────────────
    # DISABLED (<= 0.0). hmap stores ABSOLUTE odom-z, and in the DLIO sensor-
    # origin frame the floor is at z ≈ -1 m, so a fixed absolute step-over
    # threshold cannot separate a steppable curb from a tall obstacle. Since the
    # obstacle cloud is already ground-removed and curbs that g1_local_map keeps
    # are genuine obstacles, treat every point as a full blocker (safe). Re-enable
    # only if you reference step-over to the floor height in the odom frame.
    step_over_height: 0.0
    step_over_cost_scale: 0.25

    # ─── 3D voxel layer extent (RViz / 3D queries) ────────────────
    # Sensor-origin frame: floor ≈ -1 m, obstacles span roughly [-1.5, +1.5] m
    # around the sensor (vs a floor-at-0 band on a pelvis-origin frame), so the
    # z-band is widened so vmap captures the obstacle cloud. With DLIO-map fusion
    # off this only gates the vmap visualization layer.
    voxel_z_min: -2.0
    voxel_z_max: 2.0

    # Persistent-map obstacle band (used only when ground_segment_en=true; with
    # segmentation off the raw cloud is accumulated directly).
    persistent_z_min: 0.15
    persistent_z_max: 2.0
    persistent_obstacle_height: 0.30

    # ─── MPC horizon ──────────────────────────────────────────────
    mpc_N: 50                      # 50 * 0.1 s = 5 s horizon
    mpc_dt: 0.10

    # ─── Actuator lag ─────────────────────────────────────────────
    mpc_tau_v: 0.15
    mpc_tau_w: 0.12

    # ─── Velocity envelope (G1 humanoid; tracked by the AMO gait) ──
    # These go straight into the AMO RL gait via the velocity_target WS bridge,
    # so they must respect what AMO can track stably (vx ~0.3-0.5 m/s; biped vy
    # tiny; AMO saturates yaw at ±0.2 rad/s internally).
    mpc_vx_max: 0.45
    # Lateral (crab) HARD cap — the most direct lever to DISCOURAGE y motion.
    # 0.12 lets the biped take only small sidesteps (e.g. obstacle dodges) and
    # otherwise walk/turn forward. Keep in step with the AMO bridge's
    # max_lateral_vel. Set ~0.05 to effectively forbid crabbing (0 clamps to 0.01);
    # mpc_R_vy (9.0) is the soft companion lever — raise it to discourage further.
    mpc_vy_max: 0.12
    # Tuned to AMO's DEMONSTRATED yaw authority: it spins cleanly at a direct
    # --yaw 0.4 but ignores ~0.11, so its turn threshold is ~0.2-0.4. 0.20 (prev)
    # capped the command BELOW that threshold -> the MPC's gentle -0.11 produced
    # zero turning and the robot just stood. 0.80 was too high (planned turns
    # faster than AMO executes -> hunting/spin). 0.40 matches what AMO actually
    # does, with the stable 1 Hz replan avoiding the earlier path-jitter hunting.
    mpc_omega_max: 0.40
    mpc_v_ref: 0.30

    # ─── Tracking weights ─────────────────────────────────────────
    mpc_Q_x: 300.0 # before: 150.0
    mpc_Q_y: 150.0 # before: 150.0
    mpc_Q_yaw: 300.0 # before 5.0
    mpc_Q_terminal: 1000.0 # before: 180.0

    # ─── Control effort ───────────────────────────────────────────
    mpc_R_vx: 20.0 # before: 8.0
    # Lowered 12 → 3 to ENABLE y-direction navigation: at 12 the MPCC almost never
    # spent lateral effort, so it only ever drove forward + turned. At 3 it will
    # crab sideways when that tracks the path or dodges an obstacle better. Raise
    # back toward 12 if the biped's lateral gait looks unstable; drop toward 1 for
    # more aggressive sidestepping. (For PURE sideways travel without turning to
    # face the path, also lower mpcc_Q_yaw_align below.)
    mpc_R_vy: 12.0
    # Lowered 9.0 -> 3.0: with high R_omega the MPC barely used its yaw authority
    # (commanded only ~-0.11 when misaligned, below AMO's turn threshold, so the
    # robot never turned). Lower effort penalty -> it commits real yaw to align.
    mpc_R_omega: 20.0
    mpc_R_jerk: 3.0

    # ─── Obstacle barrier (per-step collision veto) ───────────────
    # Raised from 12 → 80 (issue #2): at 12 the barrier was far too weak to bend
    # the trajectory around obstacles, so the MPC tracked the A* path almost
    # regardless of what was in front of it. 80 gives firm avoidance while
    # staying well below the level that destabilises IPOPT.
    mpc_W_obs_sigmoid: 80.0
    # Sigmoid SHARPNESS. Lowered 12 → 6 (issue #3): at 12 the barrier only rose
    # in the last ~0.2 m before obs_r, so avoidance was abrupt/late. At 6 the soft
    # zone reaches ~0.4 m beyond obs_r, so the robot starts easing away from
    # obstacles EARLIER (anticipatory) — a bigger real-world gain than simply
    # raising W_obs_sigmoid, which just makes a taller wall at the same distance.
    mpc_obs_alpha: 6.0
    mpc_obs_r: 0.60                # humanoid base half-width + margin (raised 0.55→0.60 for clearance)
    # Raised 12 → 14 (issue #3): points are now chosen with ANGULAR coverage
    # (nearest per sector) instead of the 12 globally-nearest, so this budget
    # represents obstacles on every side rather than one clump on the nearest wall.
    mpc_max_obs_constraints: 14
    mpc_obs_check_radius: 3.0

    # ─── Controller mode: tracking vs time-optimal contouring (MPCC) ──
    # 'tracking'   : reference-tracking MPC — follows the A* path at a FIXED
    #                cruise v_ref. Proven/stable, but NOT time-optimal (it leaves
    #                speed budget unused).
    # 'contouring' : MPCC — parameterises the path by arc length θ and MAXIMISES
    #                progress (−q·θ) subject to the velocity limits and the
    #                obstacle barrier, so the robot reaches the goal in MINIMUM
    #                time while staying on the collision-free path. Holonomic vy
    #                is allowed (crab-walk). Heavier NLP (7 states / 4 controls) —
    #                watch solve_ms in /mpc/diagnostics; drop mpc_N or
    #                mpcc_poly_degree if it nears the 1/mpc_rate_hz budget.
    mpc_mode: contouring
    mpcc_vtheta_max: 0.55           # max progress (arc-length) speed [m/s]
    mpcc_w_contour: 300.0           # lateral path-deviation penalty (stay on path)
    mpcc_w_lag: 60.0                # longitudinal θ-mismatch penalty
    mpcc_q_progress: 2.0            # per-step reward on progress speed (push speed)
    mpcc_q_progress_terminal: 60.0  # terminal reward on θ_N (push toward goal)
    mpcc_Q_yaw_align: 40.0          # soft "face the path tangent" (low → crab freely)
    # Terminal GOAL-heading weight: aligns the MPCC horizon-end yaw to the goal
    # heading, ramped in over the last goal_align_start_dist metres. Active ONLY
    # when require_goal_heading=true; else 0 (position-only arrival, tangent owns
    # yaw). Lets the robot blend into the final heading during approach — no
    # in-place spin — instead of the post-hoc _publish_heading_align rotation.
    mpcc_Q_goal_yaw: 40.0
    mpcc_R_vtheta: 0.1              # progress-rate effort
    mpcc_poly_degree: 3             # local path polynomial fit order

    # ─── IPOPT ────────────────────────────────────────────────────
    mpc_max_iter: 100
    mpc_warm_start: true
    # Control-grade termination (Jetson §8 optimization): IPOPT's default KKT
    # tolerance is 1e-8 — digits a 10 Hz velocity command can never use, paid
    # for in iterations every solve. 1e-3 + early-accept returns as soon as the
    # solution is control-accurate (benchmarked: −32% mean solve time, worst
    # case halved, 100% solve success on the deployed MPCC problem).
    mpc_ipopt_tol: 1.0e-3
    mpc_ipopt_acceptable_tol: 1.0e-2
    mpc_ipopt_acceptable_iter: 3
    # HANG GUARD, not a per-cycle budget: must stay well above a COLD solve on
    # the Orin Nano (~150 ms). Only stops a pathological multi-second solve
    # from freezing the loop; the soft-hold path absorbs the missed cycle.
    # Do NOT tighten to the 100 ms period — an 80 ms wall made every recovery
    # solve time out and cascaded into permanent failure in benchmarks.
    mpc_max_cpu_time: 0.3

    # ─── MPC node settings ────────────────────────────────────────
    # Velocity-control loop rate: the MPC re-solves and republishes /mpc/cmd_vel
    # at this rate, so it IS the command refresh the gait sees. Must be ~10 Hz —
    # at 1 Hz the gait holds a stale velocity for a full second and can't track
    # the turn-then-walk, so the robot barely moves.
    mpc_rate_hz: 10.0
    mpc_lookahead_dist: 0.60
    # Clamp obstacle consideration to the local horizon (matches grid_half_width
    # 6 m; was 20 m, which kept far-field points the local planner never uses).
    max_lidar_range: 8.0
    mpc_path_resample_ds: 0.10
    mpc_path_smooth_window: 7
    mpc_setpoint_alpha: 0.30
    mpc_setpoint_max_step: 0.15
    mpc_setpoint_reset_dist: 1.0

    # ─── MPC obstacle z-band ──────────────────────────────────────
    # DISABLED (z_min > z_max). The obstacle cloud is already ground-removed by
    # g1_local_map, so no z-band filtering is needed before the MPC flattens it
    # to 2D — filtering twice would only delete genuine obstacles.
    obstacle_z_min: 1.0
    obstacle_z_max: -1.0

    # ─── Velocity estimation ──────────────────────────────────────
    vel_filter_alpha: 0.30

    # ─── LiDAR staleness ──────────────────────────────────────────
    # /local_voxel_map/obstacles refreshes ~10 Hz on the real robot. 1.0 s
    # tolerates transient gaps; tighten toward 0.3 s once timing is confirmed.
    lidar_max_age_sec: 1.0

    # ─── Dynamic obstacle clustering / prediction ─────────────────
    # Predict only how far ahead in the horizon to extrapolate moving obstacles.
    obs_predict_frac: 0.20
    # Cluster the obstacle cloud (grid connected-components) and track CLUSTER
    # centroids, not individual voxel points — the old code shifted the whole
    # cloud by per-point jitter, giving static walls phantom velocities.
    obs_cluster_cell: 0.30         # grid cell for connected-component clustering
    obs_static_speed: 0.15         # below this a cluster is static (not predicted)
    obs_max_track_speed: 2.5       # reject implausible centroid matches above this
    # Temporal-consistency gate (dynamic-obstacle correctness): only extrapolate a
    # cluster once its velocity agrees in direction with the previous frame's
    # (cos >= this). Rejects phantom velocity from a STATIC wall whose centroid
    # drifts as its observed extent changes across frames. Note obstacles are in
    # the odom (world) frame, so the robot's own velocity is NOT (and must not be)
    # subtracted — static obstacles already read ~zero velocity here.
    obs_dir_consistency: 0.5       # cos(60°); higher = stricter "is it really moving"
    # RViz dynamic-obstacle velocity arrows (/mpc/obstacle_velocities): arrow
    # length = speed * this many seconds (1 m/s → 1 m arrow at 1.0).
    mpc_vel_arrow_scale: 1.0

    # ─── Adaptive velocity ────────────────────────────────────────
    adaptive_vel_limits: true

    # ─── Security protocol (grid-free, debounced — issue #1) ──────
    # Engages only when a REAL obstacle point is within mpc_security_radius for
    # mpc_security_engage_cycles consecutive solves, and clears after
    # mpc_security_clear_cycles clean ones. This replaces the old inflated-grid
    # check whose single-point false triggers caused the stop/go freeze. NOTE:
    # g1_local_map drops self-hits within 0.4 m, so the trigger radius sits just
    # outside that so it only fires on a genuinely imminent collision.
    mpc_security_enable: true
    mpc_security_radius: 0.45
    mpc_security_escape_radius: 1.0
    mpc_security_engage_cycles: 3
    mpc_security_clear_cycles: 5

    # ─── Dynamic-obstacle YIELD (safety) ──────────────────────────
    # A CONFIRMED-dynamic cluster (cluster tracker + temporal-consistency gate)
    # inside — or predicted within yield_lookahead_sec to enter — the forward
    # corridor makes the robot STOP and hold until the mover has passed
    # (debounced both ways). Takes precedence over the security escape: a
    # sidestep around a walking person could step INTO their path.
    yield_enable: true
    yield_corridor_length: 2.5      # corridor ahead of the robot [m]
    yield_corridor_halfwidth: 0.7   # corridor lateral half-width [m]
    yield_lookahead_sec: 1.5        # extrapolate movers this far ahead
    yield_engage_cycles: 2          # debounce in (~0.2 s @ 10 Hz)
    yield_clear_cycles: 8           # debounce out (~0.8 s @ 10 Hz)

    # ─── Perception blind-stop (safety) ───────────────────────────
    # Past lidar_max_age_sec the MPC now HOLDS the last obstacle cloud (odom
    # frame — static structure stays valid) instead of planning with NO
    # obstacles as before. If the feed stays silent past this, hard stop:
    # never walk toward a goal blind. 0 disables (not recommended on-robot).
    lidar_blind_stop_sec: 2.5

    # ─── Fail-safe watchdog (issue #5) ────────────────────────────
    # The MPC commands ZERO velocity (not a silent hold) when pose or path goes
    # stale; the AMO bridge has its own cmd_vel timeout on top of this.
    odom_timeout_sec: 0.5
    path_timeout_sec: 2.0

    # ─── Soft-hold on transient solve failure (issue #1: stop/go) ──
    # A single failed MPCC solve used to emit a HARD zero cmd_vel → the visible
    # stop/go stutter. Instead coast on a decayed copy of the last good command
    # for mpc_soft_hold_cycles solves (@10 Hz → ~0.3 s) before zeroing, so an
    # occasional IPOPT miss no longer stops the robot. Danger/stale-data stops
    # (security layer, fail-safe watchdog) are unaffected.
    mpc_soft_hold_cycles: 3
    mpc_soft_hold_decay: 0.6

    goal_heading_kp: 1.0
    goal_heading_min_omega: 0.20    # AMO ignores very small yaw commands
    goal_heading_max_omega: 0.40
    # Final-approach heading blend (issue #2): during the last N metres steer yaw
    # toward the GOAL heading so the robot arrives aligned instead of reaching the
    # position and then spinning in place. Set 0.0 to disable (arrive-then-rotate).
    goal_align_start_dist: 1.2
    # Arrive REGARDLESS of heading: false = once x/y is within goal_reached_radius
    # the robot STOPS (no in-place spin to the goal yaw, no approach yaw blend).
    # Set true to require the final heading (restores arrive-then-align + blend).
    require_goal_heading: false

    # ─── Persistent obstacle map ──────────────────────────────────
    # Kept SHORT (10 s): a longer window (tried 45 s) smears obstacles across odom
    # drift into ghost walls that make A* detour. Long-horizon memory belongs in a
    # drift-corrected global planner, not this rolling local memory.
    map_decay_sec:  10.0
    map_max_cells:  8000

    # ─── Global planner (long-horizon routing layer) ──────────────
    # A separate world-fixed, COARSE global costmap remembers the whole traversed
    # scene + a breadcrumb of where the robot drove (the safe corridor home), and
    # global A* plans a long route on it → /global_path. The local A* follows a
    # carrot along that route while its LIVE local costmap + MPCC do precise
    # reactive avoidance. The global map is NEVER fused into the local costmap
    # (that injected ghost obstacles). Disable the whole layer with launch arg
    # global_planner:=false, or just the following with follow_global_path:=false.
    follow_global_path: true
    global_path_topic: /global_path

    # ─── Global+local costmap fusion (quality-gated) ──────────────
    # Fuses the global planner's CONFIRMED obstacle cells
    # (/global_planner/known_obstacles: hit-thresholded, decay-faded,
    # breadcrumb-carved, PRE-inflation) into the local A* grid as direct
    # obstacles once the global map is mature — long-horizon wall memory
    # without the phantom-obstacle failure of raw DLIO-map fusion.
    #   off  : previous behaviour (carrot-following only)
    #   on   : always fuse whatever the global layer has confirmed
    #   auto : fuse once >= global_fusion_min_cells cells are confirmed
    # Near-field cells (< global_fusion_min_range) are NEVER fused: the live
    # local map owns that zone, so a stale global cell can re-route the robot
    # but can never freeze it in place.
    global_fusion_mode: auto
    global_fusion_topic: /global_planner/known_obstacles
    global_fusion_min_range: 3.0
    global_fusion_min_cells: 150
    global_fusion_max_age_sec: 10.0
    global_carrot_dist: 4.0          # carrot lookahead along the global route [m]
    global_path_max_age_sec: 3.0     # fall back to direct goal if route is stale
    global_replan_hz: 1.0            # global A* replan rate
    global_reso: 0.20                # coarse → cheap + drift-tolerant
    global_half_width: 25.0          # 50 m x 50 m global workspace
    global_hit_threshold: 2.0        # cells need >=N observations to block (anti-ghost)
    global_decay: 0.997              # slow per-build fade of stale obstacles
    global_free_radius: 0.40         # breadcrumb free-space radius around the robot
    max_range: 25.0                  # ingest obstacles within this radius of the robot
